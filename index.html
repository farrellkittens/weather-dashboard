<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forecast: Graph</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="header">
  <span>NWS Hourly Weather Forecast Graph</span>
</div>

<div id="page-tabs">
  <a href="peaks.html" class="tab">Forecast: Directional</a>
  <a href="index.html" class="tab active">Forecast: Graph</a>
  <a href="roadtrip.html" class="tab">Roadtrip</a>
  <a href="camping.html" class="tab">Camping</a>
  <a href="dispersed.html" class="tab">Dispersed Camping</a>
  <a href="climbing.html" class="tab">Climbing</a>
  <a href="water.html" class="tab">SUP/Float</a>
  <a href="diving.html" class="tab">Surf Report</a>
</div>

<div id="graph-sticky-controls">
  <div id="controls">
    <section class="control-section control-section-location" aria-label="Location controls">
      <div class="control-section-title">Location</div>
      <span class="control-row">
        <span class="control-group">
          <label>City, State</label>
          <span class="city-input-wrap">
            <input id="city" placeholder="Denver, CO" autocomplete="off" oninput="debounceSuggest()">
            <button id="use-location" class="use-location-button" type="button" onclick="useDashboardBrowserLocation()" aria-label="Get my location" title="Get my location"></button>
          </span>
        </span>
        <span class="coords-readout-row">
          <span class="control-group control-group-coords">
            <label>Lat, Lon</label>
            <input id="coords" value="39.741678, -104.976111" placeholder="lat, lon" onkeydown="if(event.key==='Enter')loadForecast()">
            <button type="button" onclick="loadForecast()">Go</button>
          </span>
        </span>
      </span>
      <span class="control-row control-row-secondary location-readout-row">
        <label class="share-location-toggle">
          <input id="share-location" type="checkbox">
          <span>Use this location on all tabs</span>
        </label>
        <div id="loc"></div>
      </span>
    </section>

    <section class="control-section control-section-start" aria-label="Forecast start controls">
      <div class="control-section-title">Start</div>
      <span class="control-group">
        <label>Time</label>
        <select id="startSel"></select>
        <button onclick="applyStart()">Go</button>
      </span>
    </section>
  </div>

  <div id="chart-controls-shell">
    <div class="control-section-title">Chart Layers</div>
    <div id="chart-controls" aria-label="Chart visibility controls"></div>
  </div>
</div>

<nav id="mobile-section-nav" aria-label="Chart visibility controls"></nav>

<div id="city-suggestions"></div>
<div id="status">Loading…</div>
<div id="chart-shell">
  <div id="chart-wrap">
    <div id="chart-stage">
      <canvas id="c"></canvas>
      <canvas id="axis-c" aria-hidden="true"></canvas>
    </div>
  </div>
</div>
<div id="tip"></div>
<div id="footer">History: Open-Meteo · Forecast: NOAA/NWS api.weather.gov · UV: EPA/Open-Meteo · times shown in local browser timezone<span id="grid-ref"></span></div>

<script src="shared-location.js?v=3"></script>
<script src="app.js?v=6"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
